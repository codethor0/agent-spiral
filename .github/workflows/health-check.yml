name: ci-health

# Daily health check for main: runs the full test suite and opens a single
# tracking issue if it ever starts failing. Complements tests.yml (push/PR)
# by catching environment rot (runner images, dependency drift) that no
# commit triggered.

on:
  schedule:
    - cron: '23 7 * * *' # daily 07:23 UTC / 00:23 PT
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Pillow (optional; exercises the renderer tests)
        run: python -m pip install pillow==13.0.0
      - name: Run simulation test suite (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Open issue on failure (one at a time)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Exact title match only: the jq filter below closes/creates issues
          # with this precise title, never a loosely-matching one.
          HEALTH_TITLE: CI health check failing on main
        run: |
          NUMBER=$(gh issue list --state open --search "$HEALTH_TITLE in:title" --limit 50 \
            --json number,title \
            --jq '[.[] | select(.title == "CI health check failing on main")][0].number')
          if [ -n "$NUMBER" ] && [ "$NUMBER" != "null" ]; then
            echo "An open health-check issue already exists; not creating a duplicate."
            gh issue view "$NUMBER" --json number,title,url \
              --jq '"Existing: #\(.number) \(.title) — \(.url)"'
          else
            gh issue create --title "$HEALTH_TITLE" --body "The daily CI health check just failed on \`main\`.

            Run: $RUN_URL

            Possible causes: runner-image changes, dependency drift, or a real regression that push-triggered CI missed (e.g. timing-sensitive tests).

            This issue closes automatically as soon as a daily health check passes again."
          fi
      - name: Close health-check issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NUMBER=$(gh issue list --state open --search "CI health check failing on main in:title" --limit 50 \
            --json number,title \
            --jq '[.[] | select(.title == "CI health check failing on main")][0].number')
          if [ -n "$NUMBER" ] && [ "$NUMBER" != "null" ]; then
            gh issue close "$NUMBER" --comment "The daily CI health check is green again. Run: $RUN_URL"
          else
            echo "No open health-check issue; nothing to close."
          fi
